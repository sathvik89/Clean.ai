[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanai"
version = "2.0.0"
description = "Clean.ai - an autonomous, human-supervised data cleaning agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "pandas>=2.0",
    "numpy",
    "python-dotenv",
    "streamlit>=1.35",
    "plotly>=5.20",
    "bcrypt>=4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
